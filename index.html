<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>가계부</title>
<style>
/* 시안 B · 모노 라인: 거의 흰 바탕, 검은 글씨, 그림자 없이 가는 선으로만 나눔. 큰 숫자.
   색은 데이터에만: 지출 항목 8색(색약 검사 통과한 순서, 항목 순서에 고정, '기타'는 회색)과 주식 등락(한국식 빨강 ▲ / 파랑 ▼).
   아이콘은 모두 직접 그린 선 아이콘 (24칸, 선 1.6~1.8, 둥근 끝) */
:root {
  --bg: #fbfbf9; --ink: #111111; --mut: #74746f; --faint: #b0b0aa; --line: #e7e7e2; --field: #f1f1ed; --inv: #ffffff;
  --up: #d22f2b; --down: #2465d1;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --other: #a3a39d;
  --sans: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121211; --ink: #f2f2ee; --mut: #9b9b95; --faint: #5f5f5a; --line: #2a2a27; --field: #1e1e1c; --inv: #121211;
    --up: #ff6b66; --down: #6ea6ff;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767; --other: #6b6b66;
  }
}
* { box-sizing: border-box; touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
main { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num, b, .amt, .hero { font-variant-numeric: tabular-nums; }
.mut { color: var(--mut); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--mut); }
svg.i { display: block; flex: none; }

/* 맨 위: 계좌 글자 탭 + 설정 */
.top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.acc-tabs { display: flex; gap: 18px; font-size: 15px; font-weight: 700; }
.acc-tabs button { color: var(--faint); padding: 6px 0 3px; border-bottom: 2px solid transparent; }
.acc-tabs button.on { color: var(--ink); border-color: var(--ink); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; position: relative; margin-right: -8px; }
.icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--s4); }

/* 달 고르기 */
.mon { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--mut); }
.mon .arrows { display: flex; align-items: center; gap: 2px; }
.mon .arrows button { width: 32px; height: 32px; display: grid; place-items: center; margin: 0 -6px; color: var(--ink); }
.mon .arrows span { min-width: 104px; text-align: center; font-weight: 700; color: var(--ink); font-size: 15px; }
.mode { display: flex; gap: 12px; font-weight: 700; }
.mode button { color: var(--faint); } .mode button.on { color: var(--ink); }

.hero { font-size: 44px; font-weight: 800; letter-spacing: -.045em; line-height: 1.05; margin: 10px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-sub { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13.5px; color: var(--mut); margin-bottom: 16px; }
.hero-sub button { color: var(--ink); font-weight: 600; white-space: nowrap; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.three > div { padding: 9px 0; font-size: 12px; color: var(--mut); min-width: 0; }
.three > div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.three b { display: block; font-size: 15.5px; color: var(--ink); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-line { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--mut); padding: 6px 0; }
.note-line b { color: var(--ink); font-weight: 700; }

section { margin-top: 26px; }
h5 { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--mut); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
h5 .r { letter-spacing: 0; font-size: 13px; }
h5 button.r { color: var(--ink); font-weight: 700; display: flex; align-items: center; gap: 4px; }
.empty { color: var(--mut); padding: 14px 0; font-size: 14.5px; border-top: 1px solid var(--line); }

/* 주식 한 줄 (한국 계좌 안) */
.row-link { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.row-link b { font-size: 16px; }

/* 지출 항목 */
.stack { display: flex; gap: 2px; height: 12px; margin-bottom: 6px; }
.stack button { display: block; height: 100%; min-width: 3px; transition: opacity .15s; }
.stack button:first-child { border-radius: 3px 0 0 3px; } .stack button:last-child { border-radius: 0 3px 3px 0; }
.stack button:only-child { border-radius: 3px; }
.cl { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 50px; align-items: center; gap: 10px; width: 100%; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; transition: opacity .15s; }
.cl .n { display: flex; align-items: center; gap: 7px; min-width: 0; } .cl .n span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl .n i { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.cl .a { color: var(--mut); font-size: 14px; text-align: right; white-space: nowrap; }
.cl .p { text-align: right; font-weight: 800; }
.dimmed { opacity: .3; }

/* 연간 막대 */
.bars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px; align-items: end; height: 120px; margin-top: 30px; border-bottom: 1.5px solid var(--ink); }
.bars button { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
.bars i { display: block; width: 100%; max-width: 20px; background: var(--ink); border-radius: 4px 4px 0 0; min-height: 1px; }
.bars button.dim i { opacity: .25; }
.bars .tip { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--inv); font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap; z-index: 2; }
.bar-labels { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px; font-size: 11px; color: var(--mut); text-align: center; margin-top: 4px; }

/* 내역 */
.tx { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ring { width: 38px; height: 38px; border-radius: 50%; border: 1.3px solid var(--ink); display: grid; place-items: center; flex: none; position: relative; color: var(--ink); }
.ring > i { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg); }
.tx .m { flex: 1; min-width: 0; }
.tx .t1 { font-size: 15px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .t2 { font-size: 12.5px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .amt { font-weight: 700; font-size: 15px; white-space: nowrap; }
.acct { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.acct b { font-weight: 700; }
.acct.total { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 700; }
.acct.total b { font-size: 17px; font-weight: 800; }
h5 .pill { display: inline-flex; align-items: center; gap: 4px; letter-spacing: 0; font-size: 13.5px; font-weight: 700; color: var(--ink); border: 1.3px solid var(--ink); border-radius: 999px; padding: 6px 13px; }
.hero.up { color: var(--up); } .hero.down { color: var(--down); }
.stock .right div { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--inv); border-color: var(--ink); }
.filter { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 700; letter-spacing: 0; font-size: 13px; }

/* 주식 */
.stock { display: grid; grid-template-columns: minmax(0, 1fr) 60px auto; align-items: center; gap: 12px; width: 100%; padding: 11px 0; border-bottom: 1px solid var(--line); }
.stock .nm { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stock .t2 { font-size: 12.5px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stock .right { text-align: right; }
.stock .right b { display: block; font-weight: 700; white-space: nowrap; font-size: 15px; }
.stock .right span { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.stock svg { width: 60px; height: 26px; overflow: visible; }
.small-note { font-size: 12.5px; color: var(--mut); line-height: 1.5; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: var(--inv); font-weight: 800; white-space: nowrap; }
.btn.line { background: none; color: var(--ink); border: 1.3px solid var(--ink); }
.btn.danger { background: none; color: var(--up); border: 1.3px solid var(--line); }
.btn.wide { width: 100%; }
.btn.small { min-height: 34px; padding: 0 14px; font-size: 14px; }

/* 아래 탭 */
nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--bg); border-top: 1.5px solid var(--ink); padding: 0 8px env(safe-area-inset-bottom); }
nav.tabbar button { flex: 1; max-width: 170px; height: 56px; font-size: 14px; font-weight: 700; color: var(--faint); text-align: center; }
nav.tabbar button.on { color: var(--ink); }
.fab { position: fixed; z-index: 6; right: max(20px, calc(50% - 260px)); bottom: calc(74px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; background: var(--ink); color: var(--inv); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }

/* 아래에서 올라오는 창 */
#sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
#sheet-wrap .backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .3); }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 16px 20px calc(22px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.sh-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.sh-top .mut { font-weight: 500; }
.sh-top button { margin-right: -8px; width: 36px; height: 36px; display: grid; place-items: center; }
.sheet h2 { font-size: 24px; font-weight: 800; letter-spacing: -.03em; margin: 0 0 4px; }
.types { display: flex; gap: 18px; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.types button { color: var(--faint); padding: 4px 0 2px; border-bottom: 2px solid transparent; }
.types button.on { color: var(--ink); border-color: var(--ink); }
.big-in { display: flex; align-items: baseline; gap: 4px; border-bottom: 1.5px solid var(--ink); padding: 4px 0 4px; }
.big-in span { font-size: 36px; font-weight: 800; color: var(--faint); }
.big-in input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 42px; font-weight: 800; letter-spacing: -.04em; padding: 0; font-variant-numeric: tabular-nums; }
.big-in input::placeholder { color: var(--faint); }
.hint { font-size: 12.5px; color: var(--mut); margin: 5px 0 14px; min-height: 18px; }
.cgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 4px; margin: 6px 0 18px; }
.cgrid button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--mut); text-align: center; min-width: 0; }
.cgrid button span.lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cgrid .ring { width: 48px; height: 48px; border-color: var(--line); }
.cgrid button.on { color: var(--ink); } .cgrid button.on .ring { background: var(--ink); border-color: var(--ink); color: var(--inv); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
label.f { display: block; min-width: 0; }
label.f > small { display: block; font-size: 12px; color: var(--mut); font-weight: 600; }
.inp { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 6px 0 7px; font-size: 17px; border-radius: 0; outline: none; min-height: 40px; }
.inp:focus { border-bottom-color: var(--ink); }
.inp.lg { font-size: 22px; font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: -6px 0 16px; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.actions { display: flex; gap: 10px; margin-top: 4px; }
.actions .btn { flex: 1; }
.sec { padding: 14px 0 16px; border-top: 1px solid var(--line); }
.sec:first-of-type { border-top: 1.5px solid var(--ink); }
.sec h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; color: var(--mut); font-weight: 700; }
.sec p.mut { font-size: 13.5px; margin: 0 0 10px; }
.res { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 11px 0; border-bottom: 1px solid var(--line); }
.res .t2 { font-size: 12.5px; color: var(--mut); }
.cat-edit { display: flex; gap: 10px; align-items: center; }
.cat-edit .ring { width: 36px; height: 36px; }
.cat-edit .inp { flex: 1; }
.x-btn { flex: none; width: 34px; height: 34px; display: grid; place-items: center; color: var(--mut); }
.icon-pick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 10px 0 12px 46px; }
.icon-pick button { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); max-width: 44px; }
.icon-pick button.on { background: var(--ink); color: var(--inv); border-color: var(--ink); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14.5px; margin: 0; }
.kv dt { color: var(--mut); } .kv dd { margin: 0; text-align: right; font-weight: 700; }
.chart { position: relative; height: 180px; margin: 10px 0 6px; }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
.chart .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--ink); color: var(--inv); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; background: var(--field); padding: 8px 10px; border-radius: 8px; }
.imp-list { margin-top: 6px; }
.imp { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.imp.off { opacity: .45; }
.imp .ring { width: 32px; height: 32px; }
.imp .m { flex: 1; min-width: 0; }
.imp .t1 { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.imp .t2 { font-size: 12px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.imp .r { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
.imp .r b { font-size: 14.5px; }
.imp select { font-size: 13px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; background: var(--bg); color: var(--ink); max-width: 128px; }
.imp-bar { position: sticky; bottom: calc(-22px - env(safe-area-inset-bottom)); background: var(--bg); padding: 12px 0 calc(22px + env(safe-area-inset-bottom)); margin-bottom: calc(-22px - env(safe-area-inset-bottom)); }
.btn:disabled { opacity: .4; }
#toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--inv); padding: 10px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 600; z-index: 30; max-width: 90vw; text-align: center; }
</style>
</head>
<body>
<main>
  <header class="top">
    <nav class="acc-tabs"><button data-tab="kr">한국 계좌</button><button data-tab="de">독일 계좌</button><button data-tab="st">주식</button></nav>
    <button class="icon-btn" data-act="settings" aria-label="설정"><span id="gear"></span><span class="dot" id="sync-dot" hidden></span></button>
  </header>
  <div id="view"></div>
</main>

<button class="fab" id="fab" data-act="add" aria-label="기록 넣기"></button>
<nav class="tabbar"><button data-tab="kr">한국 ₩</button><button data-tab="de">독일 €</button><button data-tab="st">주식</button></nav>

<div id="sheet-wrap" hidden><div class="backdrop" data-act="close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script src="import.js"></script>
<script>
// ───────── 설정 ─────────
const VERSION = '2026-11-23 · 10';
const API = 'https://budget-sync.weekly-meals-reader.workers.dev';
const APP_URL = 'https://trykyn.github.io/budget/';
const LS = { key: 'budget:key', data: 'budget:data', queue: 'budget:queue', quotes: 'budget:quotes', view: 'budget:view' };
const DEFAULT_CATS = {
  kr: ['카드값', '보험', '통신', '부모님', '경조사', '구독', '세금', '기타'],
  de: ['장보기', '외식', '교통', '보험·통신', '아이들', '웰니스', '쇼핑·여행', '기타'],
};
const INCOME_HINTS = { kr: ['이자', '환급'], de: ['월급', 'Kindergeld', '환급'] };
const ACC = {
  kr: { name: '한국 계좌', cur: '₩', inLabel: '입금', xferLabel: '독일에서 송금', xferShort: '송금 받음' },
  de: { name: '독일 계좌', cur: '€', inLabel: '수입', xferLabel: '한국으로 송금', xferShort: '한국으로 송금' },
};
const SLOTS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];

// ───────── 직접 그린 아이콘 (24×24, 둥근 끝) ─────────
const P = {
  home:    '<path d="M4 10.6 12 4l8 6.6V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',
  basket:  '<path d="M3.5 9.5h17l-1.7 8.7a2 2 0 0 1-2 1.6H7.2a2 2 0 0 1-2-1.6z"/><path d="M8.2 9.5 10.6 4.5M15.8 9.5 13.4 4.5M9.5 13v3.3M14.5 13v3.3"/>',

const dir = n => n > 0.0001 ? 'up' : n < -0.0001 ? 'down' : 'flat';
const arrow = n => n > 0.0001 ? '▲' : n < -0.0001 ? '▼' : '';
const pctTxt = n => n == null || !isFinite(n) ? '–' : `${arrow(n)} ${Math.abs(n).toFixed(2)}%`;
const curSym = c => ({ KRW: '₩', EUR: '€', USD: '$' }[c] || c || '');
// 돈 입력 읽기: "1.234,50" "1,234.50" "12,5" "1.500"(=1500) 모두. 원화는 소수점 없음
function parseAmt(s, intOnly) {
  s = String(s || '').replace(/[^\d.,]/g, '');
  if (!s) return null;
  if (intOnly) s = s.replace(/[.,]/g, '');
  else {
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc >= 0 && ld >= 0) { const dec = lc > ld ? ',' : '.'; s = s.split(dec === ',' ? '.' : ',').join('').replace(dec, '.'); }
    else if (lc >= 0 || ld >= 0) { const p = s.split(lc >= 0 ? ',' : '.'); s = (p.length > 2 || p.at(-1).length === 3) ? p.join('') : p.join('.'); }
  }
  const n = parseFloat(s); return Number.isFinite(n) ? n : null;
}
const parseQty = s => { const n = parseFloat(String(s || '').replace(/\s/g, '').replace(',', '.')); return Number.isFinite(n) ? n : null; };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
function dayLabel(d) { const [y, m, dd] = d.split('-').map(Number); if (d === today()) return '오늘'; const w = new Date(y, m - 1, dd).getDay(); return `${m}월 ${dd}일 (${WD[w]})`; }
function periodLabel() { const [y, m] = V.ym.split('-'); return V.mode === 'year' ? `${y}년` : `${y}년 ${+m}월`; }
function periodKey() { return V.mode === 'year' ? V.ym.slice(0, 4) : V.ym; }
function shiftPeriod(n) {
  let [y, m] = V.ym.split('-').map(Number);
  if (V.mode === 'year') y += n; else { m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } }
  V.ym = `${y}-${String(m).padStart(2, '0')}`; V.cat = null; V.bar = null; render();
}

// ───────── 계산 ─────────
const allTx = () => Object.entries(D.tx).map(([id, t]) => ({ id, ...t }));
const txOf = acc => allTx().filter(t => t.type === 'xfer' || t.acc === acc);
// 기록 하나가 그 계좌에 주는 변화: { inc, out, xfer } (xfer = 독일에서 나간 송금, 한국은 inc 에 포함)
// sav = 저금 (내 Space 등으로 옮긴 돈: 지출이 아니고 모은 돈. 꺼내면 음수)
// pass = 그냥 지나가는 돈 (Kindergeld 받아서 바로 넘겨줌 등): 잔액엔 들어가고 수입·지출·비율엔 안 셈 (+ 들어옴 / − 나감)
// 환불(refund)은 지출을 줄임
function effect(t, acc) {
  const z = { inc: 0, out: 0, xfer: 0, sav: 0, pass: 0 };
  if (t.type === 'xfer') return acc === 'kr' ? { ...z, inc: t.krw } : { ...z, xfer: t.eur + (t.fee || 0) };
  if (t.acc !== acc) return z;
  if (t.type === 'save') return { ...z, sav: t.amount };
  if (t.pass) return { ...z, pass: t.type === 'in' ? t.amount : -t.amount };
  if (t.type === 'in') return { ...z, inc: t.amount };
  return { ...z, out: t.refund ? -t.amount : t.amount };
}
const flow = e => e.inc - e.out - e.xfer - e.sav + e.pass; // 통장에서 늘어난 돈
function sums(list, acc) {
  const s = { inc: 0, out: 0, xfer: 0, sav: 0, pass: 0, passIn: 0, passOut: 0, xEur: 0, xKrw: 0 };
  for (const t of list) {
    const e = effect(t, acc); s.inc += e.inc; s.out += e.out; s.xfer += e.xfer; s.sav += e.sav; s.pass += e.pass;
    if (e.pass > 0) s.passIn += e.pass; else s.passOut -= e.pass;
    if (t.type === 'xfer') { s.xEur += t.eur; s.xKrw += t.krw; }
  }
  s.net = s.inc - s.out - s.xfer - s.sav + s.pass; return s;
}
// 저금 한 줄(한 달 묶음)이 기준일 뒤에 준 변화: 묶인 거래(m: "날짜:센트:순번", 센트는 메인 계좌 기준)마다 날짜를 봄
function saveAfter(t, date) {
  if (!t.m || !t.m.length) return t.date > date ? t.amount : 0;
  let c = 0;
  for (const x of t.m) { const [d, cents] = x.split(':'); if (d > date) c -= +cents; }
  return Math.round(c) / 100;
}
// 기록 하나가 기준일(date) 뒤에 계좌에 준 변화
function flowAfter(t, acc, date) {
  if (t.type === 'save' && t.acc === acc) return -saveAfter(t, date);
  return t.date > date ? flow(effect(t, acc)) : 0;
}
// 한국 계좌들: 가장 최근에 한꺼번에 적은 잔액 { date, total, a }
const snapTotal = (s, ids) => Object.entries(s.a).reduce((p, [id, n]) => p + (!ids || ids.has(id) ? n : 0), 0);
function krSnaps() { return (D.kr.snaps || []).filter(s => Object.keys(s.a).length).slice().sort((a, b) => a.date.localeCompare(b.date)); }
function krSnap() { const s = krSnaps().at(-1); return s ? { date: s.date, total: snapTotal(s), a: s.a } : null; }
// 기록 안 한 돈: 지난번 잔액 합계 + 그 사이 기록 vs 이번 잔액 합계.
// 계좌 목록이 바뀐 때(새 계좌·뺀 계좌)는 옮긴 돈인지 알 수 없어서 비교하지 않음
function krGap() {
  const s = krSnaps(); if (s.length < 2) return null;
  const prev = s.at(-2), last = s.at(-1);
  const a = Object.keys(prev.a).sort().join(','), b = Object.keys(last.a).sort().join(',');
  if (a !== b) return { from: prev.date, to: last.date, changed: true };
  let expect = snapTotal(prev);
  for (const t of txOf('kr')) if (t.date <= last.date) expect += flowAfter(t, 'kr', prev.date);
  return { from: prev.date, to: last.date, gap: Math.round(snapTotal(last) - expect) };
}
function balanceNow(acc) {
  const ks = acc === 'kr' && krSnap();
  const b = ks ? { amount: ks.total, date: ks.date } : D.bal[acc]; if (!b) return null;
  let v = b.amount;
  for (const t of txOf(acc)) v += flowAfter(t, acc, b.date);
  return v;
}
// 모은 돈: 설정에서 맞춘 저금 잔액(bal.sv) + 그 뒤 저금 기록. 안 맞췄으면 가계부에 넣은 저금만 더함
function savingsNow() {
  const b = D.bal.sv; let v = b ? b.amount : 0, any = !!b;
  for (const t of allTx()) if (t.type === 'save') { v += b ? saveAfter(t, b.date) : t.amount; any = true; }
  return any ? { total: v, based: !!b } : null;
}
function catColor(acc, c) {
  if (!c || c === '기타') return 'var(--other)';
  const i = cats(acc).filter(x => x !== '기타').indexOf(c);
  return i >= 0 && i < SLOTS.length ? `var(${SLOTS[i]})` : 'var(--other)';
}
function catOf(acc, t) { return t.cat || '기타'; }

// ───────── 화면 ─────────
const $view = document.getElementById('view');
document.getElementById('gear').innerHTML = ic('gear', 22, 1.7);
document.getElementById('fab').innerHTML = ic('plus', 26, 2.2);

function render() {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === V.tab));
  // 동그란 + : 계좌 탭에서는 기록 넣기, 주식 탭에서는 종목 추가
  const fab = document.getElementById('fab');
  fab.dataset.act = V.tab === 'st' ? 'stock-add' : 'add';
  fab.setAttribute('aria-label', V.tab === 'st' ? '종목 추가' : '기록 넣기');
  lsSet(LS.view, { tab: V.tab, mode: V.mode });
  $view.innerHTML = V.tab === 'st' ? renderStocks() : renderAccount(V.tab);
  bindHistorySearch();
}

function renderAccount(acc) {
  const key = periodKey();
  const list = txOf(acc).filter(t => t.date.startsWith(key));
  const s = sums(list, acc);
  const f = n => fmtAcc(acc, n);
  const bal = balanceNow(acc);
  let h = `<div class="mon">
    <div class="arrows"><button data-act="prev" aria-label="이전">${ic('left', 18, 2.2)}</button><span>${periodLabel()}</span><button data-act="next" aria-label="다음">${ic('right', 18, 2.2)}</button></div>
    <div class="mode"><button data-act="mode" data-v="month" class="${V.mode === 'month' ? 'on' : ''}">월</button><button data-act="mode" data-v="year" class="${V.mode === 'year' ? 'on' : ''}">연</button></div></div>
    ${acc === 'kr'
      // 한국 계좌는 소득이 없어서 '남은 돈' 대신 총잔액이 맨 위 (계좌별 잔액 + 그 뒤 기록)
      ? `<div class="hero">${bal != null ? fmtKRW(bal) : '₩ –'}</div>
    <div class="hero-sub"><span>한국 계좌 총잔액${(() => { const ks = krSnap(); if (!ks || ks.date === today()) { const n = D.kr.accts.filter(a => !a.off).length; return n ? ` · 계좌 ${n}개` : ''; } const [, m, d] = ks.date.split('-').map(Number); return ` · ${m}월 ${d}일 잔액 + 그 뒤 기록`; })()}</span><button data-act="kr-accts">${bal != null ? '잔액 업데이트 ›' : '계좌 잔액 적기 ›'}</button></div>`
      // 독일 계좌도 맨 위는 통장 잔액 (맞춘 잔액 + 그 뒤 기록)
      : `<div class="hero">${bal != null ? fmtEUR(bal) : '€ –'}</div>
    <div class="hero-sub"><span>독일 계좌 잔액${(() => { const b = D.bal.de; if (!b || b.date === today()) return ''; const [, m, d] = b.date.split('-').map(Number); return ` · ${m}월 ${d}일 잔액 + 그 뒤 기록`; })()}</span><button data-act="bal" data-v="de">${bal != null ? '잔액 맞추기 ›' : 'N26 잔액 적기 ›'}</button></div>`}`;
  if (acc === 'kr') {
    h += `<div class="three"><div>들어온 돈<b>${f(s.inc)}</b></div><div>나간 돈<b>${f(s.out)}</b></div><div>독일에서<b>${fmtEUR(s.xEur)}</b></div></div>`;
    if (s.xKrw) h += `<div class="note-line">${ic('xfer', 16)}<span>${fmtEUR(s.xEur)} 보내서 <b>${fmtKRW(s.xKrw)}</b> 받음 · 평균 1€ = ${fmtKRW(s.xKrw / s.xEur)}</span></div>`;
    // 그날 환율로 추정한 송금 → 실제 받은 원화로 한꺼번에 고치기
    const nEst = allTx().filter(t => t.type === 'xfer' && t.est).length;
    if (nEst) h += `<button class="note-line" data-act="fix-krw" style="width:100%;text-align:left">${ic('xfer', 16)}<span style="flex:1">원화를 그날 환율로 추정한 송금 <b>${nEst}건</b> · 실제 받은 금액으로 고치기</span>${ic('right', 14, 2)}</button>`;
  } else {
    h += `<div class="three"><div>수입<b>${f(s.inc)}</b></div><div>지출<b>${f(s.out)}</b></div><div>한국으로<b>${f(s.xfer)}</b></div></div>`;
    if (s.xKrw) h += `<div class="note-line">${ic('xfer', 16)}<span>한국 계좌에 <b>${fmtKRW(s.xKrw)}</b> 들어감 · 평균 1€ = ${fmtKRW(s.xKrw / s.xEur)}</span></div>`;
    const sv = savingsNow();
    // 저금 줄: 누르면 모은 돈(저금 Space 잔액)을 바로 고칠 수 있음
    h += `<button class="note-line" data-act="bal" data-v="sv" style="width:100%;text-align:left">${ic('piggy', 16)}<span style="flex:1">${sv || s.sav
      ? `${V.mode === 'year' ? '올해' : '이번 달'} 저금 <b>${signed(fmtEUR, s.sav)}</b>${sv ? ` · 모은 돈 <b>${fmtEUR(sv.total)}</b>${sv.based ? '' : ' <span class="mut">(넣은 기록만 · 눌러서 맞추기)</span>'}` : ''}`
      : '저금(Space) 잔액 맞추기'}</span>${ic('right', 14, 2)}</button>`;
  }
  // 그냥 지나간 돈 (Kindergeld → 남편 등): 수입·지출엔 안 넣고 여기만 보여줌
  if (s.passIn || s.passOut) h += `<div class="note-line">${ic('xfer', 16)}<span>그냥 지나간 돈 · 들어옴 ${f(s.passIn)} · 나감 ${f(s.passOut)}${s.passIn && s.passOut ? ` · <b>남음 ${signed(f, s.pass)}</b>` : ''}</span></div>`;
  if (acc === 'kr') h += renderKrAccounts();
  if (acc === 'kr' && Object.keys(D.stocks).length) {
    const P = portfolio(), g = P.gainPct != null;
    h += `<button class="row-link" data-tab="st"><span class="mut">주식${g ? ' · 평단 대비' : ''}</span><span style="flex:1;text-align:right"><b>${P.total != null ? fmtKRW(P.total) : '–'}</b>
      <span class="${dir(g ? P.gain : P.today)}" style="font-weight:700;margin-left:8px">${g ? pctTxt(P.gainPct) : P.today != null ? pctTxt(P.todayPct) : ''}</span></span>${ic('right', 16, 2)}</button>`;
  }
  h += renderSpending(acc, list, s.out);
  if (V.mode === 'year') h += renderYearBars(acc);
  h += renderHistory(acc, list);
  return h;
}

// 내 한국 계좌들: 계좌별 잔액(토스 등에서 보고 한꺼번에 적음) + 합계 + 기록 안 한 돈
function renderKrAccounts() {
  const s = krSnap();
  const active = D.kr.accts.filter(a => !a.off);
  if (!active.length || !s) return `<button class="note-line" data-act="kr-accts" style="width:100%;text-align:left">${ic('card', 16)}<span style="flex:1">한국 계좌들 잔액 적기 <span class="mut">· 토스에서 보고 계좌별로 적으면 총잔액을 계산해요</span></span>${ic('right', 14, 2)}</button>`;
  const [, m, d] = s.date.split('-').map(Number);
  let h = `<section style="margin-top:18px"><h5><span>내 계좌 ${active.length} · ${m}월 ${d}일 기준</span><button class="pill" data-act="kr-accts">잔액 업데이트</button></h5>`;
  h += active.map(a => `<div class="acct"><span>${esc(a.name)}</span><b class="num">${a.id in s.a ? fmtKRW(s.a[a.id]) : '–'}</b></div>`).join('');
  h += `<div class="acct total"><span>합계</span><b class="num">${fmtKRW(s.total)}</b></div>`;
  const g = krGap();
  if (g) {
    const [, fm, fd] = g.from.split('-').map(Number);
    if (g.changed) h += `<div class="note-line mut">계좌 목록이 바뀌어서 ${fm}월 ${fd}일과는 비교하지 않았어요. 다음 업데이트부터 다시 비교해요.</div>`;
    else if (Math.abs(g.gap) < 1000) h += `<div class="note-line">${fm}월 ${fd}일 이후 기록이 잔액과 맞아요.</div>`;
    else h += `<div class="note-line" style="justify-content:space-between"><span>${fm}월 ${fd}일 이후 <b>기록 안 한 ${g.gap < 0 ? '지출' : '입금'} ${fmtKRW(Math.abs(g.gap))}</b></span><button class="pill" style="font-size:12.5px;padding:4px 10px;border:1.3px solid var(--ink);border-radius:999px;font-weight:700;white-space:nowrap" data-act="kr-gap">기록으로 넣기</button></div>`;
  }
  return h + `</section>`;
}

function renderSpending(acc, list, total) {
  const f = n => fmtAcc(acc, n);
  let h = `<section><h5><span>지출 항목</span>${V.cat ? `<button class="filter" data-act="cat" data-v="">${esc(V.cat)} ${ic('x', 14, 2.2)}</button>` : `<span class="r num">${f(total)}</span>`}</h5>`;
  if (total <= 0.004) return h + `<p class="empty">${V.mode === 'year' ? '이 해' : '이번 달'}에 지출 기록이 없어요</p></section>`;
  // 항목별 합계 (환불은 그 항목에서 뺌, 그냥 지나가는 돈은 안 셈)
  const by = {};
  for (const t of list) if (t.type === 'out' && t.acc === acc && !t.pass) { const c = catOf(acc, t); by[c] = (by[c] || 0) + (t.refund ? -t.amount : t.amount); }
  const pos = Object.keys(by).filter(c => by[c] > 0.004), sum = pos.reduce((a, c) => a + by[c], 0) || 1;
  const rows = pos.map(c => ({ c, v: by[c], p: by[c] / sum * 100, col: catColor(acc, c) })).sort((a, b) => b.v - a.v);
  h += `<div class="stack">${rows.map(r => `<button data-act="cat" data-v="${esc(r.c)}" class="${V.cat && V.cat !== r.c ? 'dimmed' : ''}" style="flex:${r.v};background:${r.col}" aria-label="${esc(r.c)} ${r.p.toFixed(1)}%"></button>`).join('')}</div>`;
  h += rows.map(r => `<button class="cl${V.cat && V.cat !== r.c ? ' dimmed' : ''}" data-act="cat" data-v="${esc(r.c)}">${ic(catIcon(r.c), 20)}
    <span class="n"><span>${esc(r.c)}</span><i style="background:${r.col}"></i></span><span class="a num">${f(r.v)}</span><span class="p num">${r.p < 1 ? r.p.toFixed(1) : Math.round(r.p)}%</span></button>`).join('');
  return h + `</section>`;
}

function renderYearBars(acc) {
  const y = V.ym.slice(0, 4);
  const vals = Array.from({ length: 12 }, (_, i) => {
    const key = `${y}-${String(i + 1).padStart(2, '0')}`;
    return Math.max(0, txOf(acc).filter(t => t.date.startsWith(key) && t.type === 'out' && t.acc === acc && !t.pass && (!V.cat || catOf(acc, t) === V.cat)).reduce((a, t) => a + (t.refund ? -t.amount : t.amount), 0));
  });
  const max = Math.max(...vals);
  if (!max) return '';
  const nz = vals.filter(Boolean), avg = nz.reduce((a, b) => a + b, 0) / nz.length;
  return `<section><h5><span>달마다 지출${V.cat ? ` · ${esc(V.cat)}` : ''}</span><span class="r">평균 ${fmtAcc(acc, avg)}</span></h5>
    <div class="bars">${vals.map((v, i) => `<button data-act="bar" data-v="${i}" class="${V.bar != null && V.bar !== i ? 'dim' : ''}" aria-label="${i + 1}월 ${fmtAcc(acc, v)}">
      ${V.bar === i ? `<span class="tip">${fmtAcc(acc, v)}</span>` : ''}<i style="height:${v / max * 100}%"></i></button>`).join('')}</div>
    <div class="bar-labels">${vals.map((_, i) => `<span>${i + 1}</span>`).join('')}</div></section>`;
}

function txRow(acc, t) {
  let ring, t1, t2, amt;
  if (t.type === 'xfer') {
    ring = `<span class="ring">${ic('xfer', 18)}</span>`;
    t1 = t.memo || ACC[acc].xferLabel;
    t2 = `${fmtEUR(t.eur)} → ${t.est ? '≈' : ''}${fmtKRW(t.krw)}${t.est ? ' (그날 환율 추정)' : ` · 1€ = ${fmtKRW(t.krw / t.eur)}`}${t.fee ? ` · 수수료 ${fmtEUR(t.fee)}` : ''}`;
    amt = acc === 'kr' ? (t.est ? '+≈' : '+') + fmtKRW(t.krw) : '−' + fmtEUR(t.eur + (t.fee || 0));
  } else if (t.type === 'save') {
    ring = `<span class="ring">${ic('piggy', 18)}</span>`;
    t1 = t.memo || '저금'; t2 = (t.amount >= 0 ? '저금' : '저금에서 꺼냄') + (t.n ? ` · ${t.n}건 묶음` : '');
    amt = (t.amount >= 0 ? '−' : '+') + fmtEUR(Math.abs(t.amount));
  } else if (t.pass) {
    ring = `<span class="ring" style="border-style:dashed">${ic('xfer', 18)}</span>`;
    t1 = t.memo || '그냥 지나가는 돈'; t2 = '그냥 지나가는 돈 (수입·지출에 안 셈)'; amt = (t.type === 'in' ? '+' : '−') + fmtAcc(acc, t.amount);
  } else if (t.type === 'in') {

function historyRows(acc, list) {
  const q = (V.q || '').trim().toLowerCase();
  let rows;

    const qn = q.replace(/[^\d]/g, '');
    rows = txOf(acc).filter(t => {
      const hay = `${t.memo || ''} ${t.cat || ''} ${t.type === 'xfer' ? ACC[acc].xferLabel : ''} ${t.pass ? '그냥 지나가는 돈' : ''} ${t.refund ? '환불' : ''}`.toLowerCase();
      const amts = [t.amount, t.eur, t.krw].filter(x => x != null).map(x => String(Math.abs(x)).replace('.', ''));
      return hay.includes(q) || (qn.length >= 2 && amts.some(a => a.includes(qn)));
    });
  } else {
    rows = list.slice();
    if (V.cat) rows = rows.filter(t => t.type === 'out' && t.acc === acc && catOf(acc, t) === V.cat);
  }
  return rows.sort((a, b) => b.date.localeCompare(a.date) || (b.u || 0) - (a.u || 0));
}
function historyListHTML(acc, rows) {

  return head + rows.map(t => txRow(acc, t)).join('');
}

const holdings = () => Object.entries(D.stocks).map(([id, s]) => ({ id, ...s }));
const fxKRW = cur => !cur || cur === 'KRW' ? 1 : QUOTES[`${cur}KRW=X`]?.p;
function hv(h) {
  const q = QUOTES[h.sym]; if (!q) return { q: null };
  const cur = q.cur || h.cur, fx = fxKRW(cur);
  const o = { q, cur, fx, val: null, today: null, gain: null, cost: null, gainPct: h.avg ? (q.p / h.avg - 1) * 100 : null };
  if (fx) {
    o.val = q.p * h.qty * fx;
    o.today = q.prev != null ? (q.p - q.prev) * h.qty * fx : null;
    o.gain = h.avg ? (q.p - h.avg) * h.qty * fx : null;
    o.cost = h.avg ? h.avg * h.qty * fx : null;
  }
  return o;
}
// 수익은 평단 기준 (평단을 넣은 종목만). 오늘 등락은 참고로만
function portfolio() {
  let total = 0, today = 0, gain = 0, cost = 0, anyAvg = false, any = false, missing = 0;
  for (const h of holdings()) {
    if (!h.avg) missing++;
    const v = hv(h);
    if (v.val == null) continue;
    any = true; total += v.val; today += v.today || 0;
    if (v.gain != null) { gain += v.gain; cost += v.cost; anyAvg = true; }
  }
  return { total: any ? total : null, today: any ? today : null, todayPct: any && total - today ? today / (total - today) * 100 : null, gain: anyAvg ? gain : null, cost: anyAvg ? cost : null, gainPct: anyAvg && cost ? gain / cost * 100 : null, missing };
}
// 작은 그래프: 최근 1개월 + 점선 = 내 평단
function spark(closes, cls, avg) {
  if (!closes || closes.length < 2) return '<svg></svg>';
  const all = avg ? [...closes, avg] : closes;
  const min = Math.min(...all), max = Math.max(...all), w = 60, hh = 26, rng = max - min || 1;
  const Y = c => (hh - (c - min) / rng * hh).toFixed(1);
  const pts = closes.map((c, i) => `${(i / (closes.length - 1) * w).toFixed(1)},${Y(c)}`).join(' ');
  return `<svg viewBox="0 0 60 26" aria-hidden="true">${avg ? `<line x1="0" x2="60" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--mut)" stroke-width="1" stroke-dasharray="2 2.5"/>` : ''}<polyline points="${pts}" fill="none" stroke="var(--${cls === 'flat' ? 'mut' : cls})" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

let quoting = false;
async function refreshQuotes(force) {
  if (quoting) return;
  if (!force && Date.now() - quotesAt < 60000) return;
  const syms = new Set(['EURKRW=X']);
  for (const h of holdings()) { syms.add(h.sym); const c = QUOTES[h.sym]?.cur || h.cur; if (c && c !== 'KRW') syms.add(`${c}KRW=X`); }
  quoting = true;
  try {
    const r = await fetch(`${API}/q?s=${encodeURIComponent([...syms].join(','))}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    for (const [s, q] of Object.entries(j)) if (q) QUOTES[s] = q;
    const need = holdings().map(h => QUOTES[h.sym]?.cur).filter(c => c && c !== 'KRW' && !QUOTES[`${c}KRW=X`]);
    if (need.length) {
      const r2 = await fetch(`${API}/q?s=${encodeURIComponent([...new Set(need)].map(c => `${c}KRW=X`).join(','))}`);
      if (r2.ok) for (const [s, q] of Object.entries(await r2.json())) if (q) QUOTES[s] = q;
    }
    quotesAt = Date.now(); QUOTES._at = quotesAt; lsSet(LS.quotes, QUOTES);

  } catch { if (force) toast('시세를 못 받았어요. 인터넷을 확인해 주세요'); }

}

    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.oninput = () => { fn(el.value); hint(); }; };
    on('f-amt', v => st.amount = v);
    on('f-eur', v => {
      st.eur = v;
      const e = parseAmt(v), r = rate();
      if (!st.krwTouched && e && r) { st.krw = String(Math.round(e * r)); document.getElementById('f-krw').value = st.krw; }
    });
    on('f-krw', v => { st.krw = v; st.krwTouched = !!v; });
    on('f-fee', v => st.fee = v);
    on('f-date', v => st.date = v);
    on('f-memo', v => st.memo = v);
    hint();
    const del = document.getElementById('f-del');
    if (del) del.onclick = () => { if (confirm('이 기록을 지울까요?')) { change('tx', id, null); closeSheet(); toast('지웠어요'); } };
    document.getElementById('f-save').onclick = () => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return toast('날짜를 골라 주세요');
      let rec;
      if (st.type === 'xfer') {
        const eur = parseAmt(st.eur), krw = parseAmt(st.krw, true), fee = parseAmt(st.fee);
        if (!eur || !krw) return toast('보낸 돈과 받은 돈을 넣어 주세요');
        rec = { type: 'xfer', date: st.date, eur: Math.round(eur * 100) / 100, krw: Math.round(krw), ...(old?.src ? { src: old.src } : {}), ...(old?.est && Math.round(krw) === old.krw ? { est: true } : {}), ...(fee ? { fee: Math.round(fee * 100) / 100 } : {}), ...(st.memo.trim() ? { memo: st.memo.trim() } : {}), u: Date.now() };
      } else {
        const amount = parseAmt(st.amount, acc === 'kr');
        if (!amount) return toast('금액을 넣어 주세요');
        rec = { acc, type: st.type, date: st.date, amount: acc === 'kr' ? Math.round(amount) : Math.round(amount * 100) / 100, u: Date.now() };
        if (st.type === 'save') {
          rec.amount *= st.dir; if (old?.n) rec.n = old.n;
          if (old?.m && old.amount === rec.amount && old.date === rec.date) rec.m = old.m; // 금액·날짜를 그대로 두면 묶음 정보 유지
        }
        if (st.type === 'out') rec.cat = st.pass ? (st.cat || '기타') : (st.cat || '기타');
        if ((st.type === 'out' || st.type === 'in') && st.pass) rec.pass = true;
        if (st.type === 'out' && st.refund && !st.pass) rec.refund = true;
        if (st.memo.trim()) rec.memo = st.memo.trim();
        if (old?.src) rec.src = old.src;
        if (old?.rec) rec.rec = old.rec;
      }
      let txId = id || newId();
      // 매달 반복: 반복 기록을 만들고, 이 기록은 그 첫 달 것으로
      if (!old && st.recur && (st.type === 'out' || st.type === 'in')) {
        const rid = newId(), ym = ymOf(st.date);
        change('recur', rid, { acc, type: rec.type, amount: rec.amount, ...(rec.cat ? { cat: rec.cat } : {}), ...(rec.memo ? { memo: rec.memo } : {}), ...(rec.pass ? { pass: true } : {}), day: Math.min(28, +st.date.slice(8)), from: ym, last: ym });
        txId = `r${rid}${ym.replace('-', '')}`.slice(0, 24); rec.rec = `${rid}:${ym}`;
      }
      change('tx', txId, rec);
      if (ymOf(st.date) !== V.ym && V.mode === 'month') V.ym = ymOf(st.date);
      closeSheet(); toast(old ? '고쳤어요' : '넣었어요');
    };
    if (!old) setTimeout(() => (document.getElementById('f-amt') || document.getElementById('f-eur'))?.focus(), 250);
  };
  openSheet(''); draw();
}

async function loadChart(sym, range, cur, avg) {
  const k = `${sym}|${range}`;
  let c = chartCache[k];
  if (!c) {
    try { const r = await fetch(`${API}/c?s=${encodeURIComponent(sym)}&r=${range}`); if (!r.ok) throw 0; c = chartCache[k] = await r.json(); }
    catch { const el = document.getElementById('chart'); if (el) el.innerHTML = '<p class="small-note" style="padding-top:70px;text-align:center">그래프를 못 받았어요</p>'; return; }
  }
  const el = document.getElementById('chart'); if (!el) return;
  const q = QUOTES[sym], closes = c.closes.slice(), ts = c.ts.slice();
  if (q && range !== '5y') { closes.push(q.p); ts.push(q.t || Date.now() / 1000); }
  if (closes.length < 2) { el.innerHTML = '<p class="small-note" style="padding-top:70px;text-align:center">자료가 없어요</p>'; return; }
  const W = el.clientWidth || 320, H = 180, padT = 24, padB = 20;
  // 평단도 그래프 안에 보이게 (점선)
  const all = avg ? [...closes, avg] : closes;
  const min = Math.min(...all), max = Math.max(...all), rng = max - min || 1;
  const X = i => i / (closes.length - 1) * W, Y = v => padT + (1 - (v - min) / rng) * (H - padT - padB);
  const cls = dir(avg ? closes.at(-1) - avg : closes.at(-1) - closes[0]), col = `var(--${cls === 'flat' ? 'mut' : cls})`;
  const avgLine = avg ? `<line x1="0" x2="${W}" y1="${Y(avg).toFixed(1)}" y2="${Y(avg).toFixed(1)}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="${W}" y="${(Y(avg) - 5).toFixed(1)}" font-size="11.5" font-weight="700" fill="var(--ink)" text-anchor="end">내 평단 ${fmtCur(cur, avg)}</text>` : '';
  const d = closes.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const fd = t => { const x = new Date(t * 1000); return range === '5y' || range === '1y' ? `${x.getFullYear() % 100}.${x.getMonth() + 1}.${x.getDate()}` : `${x.getMonth() + 1}.${x.getDate()}`; };
  const chg = (closes.at(-1) / closes[0] - 1) * 100;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">
    <line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="var(--ink)" stroke-width="1.5"/>
    ${avgLine}
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <text x="0" y="${H - 4}" font-size="11" fill="var(--mut)">${fd(ts[0])}</text>
    <text x="${W}" y="${H - 4}" font-size="11" fill="var(--mut)" text-anchor="end">${fd(ts.at(-1))}</text>
    <text x="0" y="12" font-size="12" font-weight="700" fill="var(--mut)">기간 <tspan fill="var(--${dir(chg) === 'flat' ? 'mut' : dir(chg)})">${arrow(chg)} ${Math.abs(chg).toFixed(1)}%</tspan> · 최고 ${fmtCur(cur, max)} · 최저 ${fmtCur(cur, min)}</text>
    <g id="cross" visibility="hidden"><line id="cx" y1="${padT}" y2="${H - padB}" stroke="var(--mut)"/><circle id="cd" r="4.5" fill="${col}" stroke="var(--bg)" stroke-width="2"/></g>
  </svg><div class="tip" id="ctip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('#ctip');
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const i = Math.max(0, Math.min(closes.length - 1, Math.round(px / r.width * (closes.length - 1))));
    const x = X(i), y = Y(closes[i]);
    svg.querySelector('#cross').setAttribute('visibility', 'visible');
    svg.querySelector('#cx').setAttribute('x1', x); svg.querySelector('#cx').setAttribute('x2', x);
    svg.querySelector('#cd').setAttribute('cx', x); svg.querySelector('#cd').setAttribute('cy', y);
    tip.hidden = false; tip.textContent = `${fd(ts[i])} · ${fmtCur(cur, closes[i])}`;
    tip.style.left = Math.max(60, Math.min(r.width - 60, x / W * r.width)) + 'px';
  };
  const leave = () => { svg.querySelector('#cross').setAttribute('visibility', 'hidden'); tip.hidden = true; };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', leave);
  svg.addEventListener('touchmove', move, { passive: true }); svg.addEventListener('touchend', leave);
}

// N26 가져오기 (독일 계좌). 파일은 이 기기 안에서만 읽음 (import.js)
let pdfjsReady = null;
function loadPdfJs() {
  if (!pdfjsReady) pdfjsReady = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(); };
    s.onerror = () => { pdfjsReady = null; rej(new Error('pdf.js')); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
async function pdfToPages(buf) {
  await loadPdfJs();
  const doc = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    pages.push(N26.pdfItemsToLines(tc.items.filter(it => it.str && it.str.trim()).map(it => ({ x: it.transform[4], y: it.transform[5], s: it.str, w: it.width }))));
  }
  return pages;
}
// 아이콘 이름 → 독일 계좌 항목 이름 (항목 이름을 바꿔도 아이콘으로 찾음)
function catForIcon(key) {
  const list = cats('de');
  const find = k => list.find(c => catIcon(c) === k);
  const alt = { phone: 'shield', shield: 'phone', suitcase: 'bag', bag: 'suitcase', cafe: 'food' };
  return (key && (find(key) || (alt[key] && find(alt[key])))) || (list.includes('기타') ? '기타' : list.at(-1));
}
async function eurKrwRates(fromDate) {
  const range = (Date.now() - new Date(fromDate).getTime()) / 864e5 > 360 ? '5y' : '1y';
  try {
    const r = await fetch(`${API}/c?s=${encodeURIComponent('EURKRW=X')}&r=${range}`);
    const j = await r.json();
    return j.ts.map((t, i) => [new Date((t + 43200) * 1000).toISOString().slice(0, 10), j.closes[i]]);
  } catch { return []; }
}
function rateOn(list, date) {
  let v = null;
  for (const [d, r] of list) { if (d <= date) v = r; else break; }
  return v ?? list[0]?.[1] ?? QUOTES['EURKRW=X']?.p ?? null;
}

      pass: take.filter(x => x.act === 'pass').length, save: take.filter(x => x.act === 'save').length, skip: inRange.length - take.length,

    const shown = (st.filter === 'skip' ? inRange.filter(x => x.act === 'skip')
      : st.filter === 'check' ? take.filter(isCheck)
      : ['xfer', 'in', 'save', 'pass'].includes(st.filter) ? take.filter(x => x.act === st.filter) : take).slice().sort((a, b) => a.r.date.localeCompare(b.r.date));
    // 지출 합계: 항목 지출 − 환불 (송금·저금·그냥 지나가는 돈은 빼고)
    const sumOut = take.reduce((a, x) => a + (x.act.startsWith('cat:') ? -x.r.amount : x.act.startsWith('ref:') ? -x.r.amount : 0), 0);
    const o = (v, label, x) => `<option value="${esc(v)}"${sel(x) === v ? ' selected' : ''}>${esc(label)}</option>`;
    const opt = x => {
      if (x.save) return o('save', '저금', x) + o('skip', '빼기', x);
      if (x.r.amount > 0) return o('in', '수입', x) + cats('de').map(c => o(`ref:${c}`, `환불 · ${c}`, x)).join('') + o('pass', '그냥 지나가는 돈', x) + o('skip', '빼기', x);
      return cats('de').map(c => o(`cat:${c}`, c, x)).join('') + o('xfer', '한국으로 송금', x) + o('pass', '그냥 지나가는 돈', x) + o('skip', '빼기', x);
    };
    const icoFor = x => x.act === 'xfer' || x.act === 'pass' ? 'xfer' : x.act === 'in' ? 'in' : x.act === 'save' ? 'piggy' : x.act === 'skip' ? 'x' : catIcon(x.act.slice(4));
    let h = shTop('N26 가져오기', esc(st.name)) + `<h2>${take.length}건 넣기</h2>
      <p class="mut" style="margin:4px 0 12px;font-size:13.5px">파일에서 ${st.total}건 읽음${st.dup ? ` · 이미 있는 ${st.dup}건 건너뜀` : ''}${st.manualDup ? ` · 직접 넣은 것과 같은 ${st.manualDup}건 건너뜀` : ''}${st.internal ? ` · 내 Space 이동 ${st.internal}건은 달마다 '저금' 한 줄로 묶음` : ''}<br>지출 합계 ${fmtEUR(sumOut)}</p>
      <div class="fields" style="margin-bottom:10px"><label class="f"><small>이 날짜부터</small><input class="inp" type="date" id="i-from" value="${st.from}"></label><span></span></div>
      <div class="types" style="font-size:14px;gap:14px;flex-wrap:wrap">${[['all', '전체'], ['check', '확인 필요'], ['xfer', '송금'], ['in', '수입'], ['pass', '지나가는 돈'], ['save', '저금'], ['skip', '뺀 것']].filter(([k]) => k === 'all' || counts[k] || st.filter === k).map(([k, l]) => `<button data-f="${k}" class="${st.filter === k ? 'on' : ''}">${l} ${counts[k]}</button>`).join('')}</div>
      ${st.filter === 'check' ? `<p class="small-note" style="margin:6px 0 0">어느 항목인지 몰라서 '${esc(catForIcon(null))}'로 둔 거예요. 고르면 같은 곳의 다른 거래도 같이 바뀌고, 다음부터 기억해요.</p>` : ''}
      ${st.filter === 'pass' ? `<p class="small-note" style="margin:6px 0 0">받아서 바로 넘겨준 돈(Kindergeld → 남편 등)이에요. 잔액엔 들어가고 수입·지출엔 안 들어가요. Kindergeld가 들어오고 열흘 안에 비슷한 금액을 계좌이체로 보낸 건 알아서 짝지었어요.</p>` : ''}
      <div class="imp-list">${shown.map(x => `<div class="imp${x.act === 'skip' ? ' off' : ''}">
          <span class="ring"${x.act === 'pass' ? ' style="border-style:dashed"' : ''}>${ic(icoFor(x), 17)}</span>
          <span class="m"><div class="t1">${esc(x.memo)}</div><div class="t2">${x.save ? `${+x.save.ym.slice(5)}월 · ${x.save.n}건${x.save.add ? ' 더' : ''} 묶음 (${x.save.amount >= 0 ? '저금에 넣음' : '저금에서 꺼냄'})` : dayLabel(x.r.date)}${x.pairOf && x.act === 'pass' ? ` · ${esc(x.pairOf.memo)} 전달` : ''}${x.act === 'xfer' ? ` · €${(x.fee.eur).toLocaleString('ko-KR')}${x.fee.fee ? ` + 수수료 ${fmtEUR(x.fee.fee)}` : ''}` : ''}${x.r.ref && x.act !== 'xfer' ? ' · ' + esc(x.r.ref.slice(0, 40)) : ''}</div></span>
          <span class="r"><b class="num">${x.r.amount > 0 ? '+' : '−'}${fmtEUR(Math.abs(x.r.amount))}</b><select data-i="${x.i}" aria-label="항목">${opt(x)}</select></span></div>`).join('') || '<p class="empty">없어요</p>'}</div>
      <div class="imp-bar"><button class="btn wide" id="i-go"${take.length ? '' : ' disabled'}>${take.length}건 넣기</button></div>`;
    $sheet.innerHTML = h;
    $sheet.scrollTop = top;
    $sheet.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { st.filter = b.dataset.f; $sheet.scrollTop = 0; draw(); });
    document.getElementById('i-from').onchange = e => { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { st.from = e.target.value; draw(); } };
    $sheet.querySelectorAll('select[data-i]').forEach(s => s.onchange = () => {
      const x = st.rows[+s.dataset.i], v = s.value;
      x.act = v; x.manual = true;
      let n = 0;
      // 같은 곳·같은 방향(들어온 돈/나간 돈)의 다른 거래도 바꾸고, 다음부터 기억 (환불 항목은 'cat:' 로 기억)
      // 단, '그냥 지나가는 돈'으로 고른 나간 돈은 그 사람에게 보낸 모든 돈이 아닐 수 있어서 그 한 건만
      if (x.rkey && !(v === 'pass' && x.r.amount < 0)) {
        st.rules[x.rkey] = v.startsWith('ref:') ? `cat:${v.slice(4)}` : v;
        for (const y of st.rows) if (y !== x && !y.manual && !y.dup && !y.save && y.rkey === x.rkey) { y.act = v; n++; }
      }
      if (v === 'pass' && x.r.amount > 0) n += N26.pairPass(st.rows.filter(y => !y.dup && !y.hidden && !y.save)).length;
      if (n) toast(`같은 곳 ${n}건도 바꿨어요`);
      draw();
    });
    document.getElementById('i-go').onclick = () => doImport(take);
  };

  async function readFile(file) {
    st.step = 'busy'; st.name = file.name; st.err = null; draw();
    try {
      let recs;
      if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') recs = N26.parsePdfLines(await pdfToPages(await file.arrayBuffer()));
      else recs = N26.parseCsv(await file.text());
      if (!recs.length) throw new Error('거래를 못 찾았어요. N26 PDF나 CSV가 맞는지 확인해 주세요.');
      recs = N26.withSrc(recs).sort((a, b) => a.date.localeCompare(b.date));
      const have = new Set(Object.values(D.tx).map(t => t.src).filter(Boolean));
      st.rows = recs.map((r, i) => {
        const s = N26.suggest(r, { rules: D.rules });
        const pick = (cat, key) => cat && cats('de').includes(cat) ? cat : catForIcon(key);
        const act = s.type === 'out' ? `cat:${pick(s.cat, s.key)}` : s.type === 'refund' ? `ref:${pick(s.cat, s.key)}` : s.type;
        return { i, r, act, pkey: s.pkey, rkey: s.rkey, memo: s.memo || r.partner || '(이름 없음)', unknown: s.type === 'out' && !s.key && !s.cat, internal: s.why === 'internal', dup: have.has(r.src), fee: N26.splitFee(r.amount) };
      });
      // 직접 넣은 기록과 같은 거래(날짜 ±3일, 같은 금액, 같은 방향)는 건너뜀 → 넣을 때 그 기록에 가져오기 표시를 붙여 둠
      const dd = (a, b) => Math.abs(Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10)) - Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10))) / 864e5;
      const r2 = n => Math.round(n * 100) / 100, usedManual = new Set();
      const manual = Object.entries(D.tx).filter(([, t]) => !t.src); // 직접 넣었거나 매달 반복으로 만든 기록
      st.manualDup = 0;
      for (const x of st.rows) {
        if (x.dup || x.internal) continue;
        const amt = r2(Math.abs(x.r.amount));
        const hit = manual.find(([id, t]) => !usedManual.has(id) && dd(t.date, x.r.date) <= 3 && (
          x.act === 'xfer' ? t.type === 'xfer' && (r2(t.eur) === x.fee.eur || r2(t.eur + (t.fee || 0)) === amt)
            : t.acc === 'de' && t.amount === amt && (x.r.amount > 0 ? (t.type === 'in' || (t.type === 'out' && t.refund)) : (t.type === 'out' && !t.refund))));
        if (hit) { usedManual.add(hit[0]); x.dup = true; x.match = hit[0]; st.manualDup++; }
      }
      // Kindergeld 같은 '그냥 지나가는 돈'과 바로 넘겨준 이체를 짝짓기
      // (이미 넣어 둔 Kindergeld 도 짝의 기준이 됨 → 예전에 빠졌던 '넘겨준 돈'을 다시 가져오면 알아서 짝지어짐)
      N26.pairPass(st.rows.filter(x => !x.internal));
      // 내 Space 이동 → 달마다 '저금' 한 줄 (src = n26save:YYYY-MM).
      // 묶인 거래 목록(m)을 같이 저장 → 다시 가져오면 아직 안 넣은 거래만 더함 (한 달 중간부터 받은 파일이어도 안전)
      const groups = {};
      for (const x of st.rows) if (x.internal) { // internal = Space 이동이고 직접 고른 규칙이 없음
        x.hidden = true;
        const ym = x.r.date.slice(0, 7), g = groups[ym] = groups[ym] || { members: [], last: x.r.date, name: '' };
        g.members.push({ k: x.r.src.replace(/^n26:/, ''), cents: Math.round(x.r.amount * 100), date: x.r.date });
        if (x.r.date > g.last) g.last = x.r.date;
        if (!g.name && x.r.partner && x.r.partner !== 'Space') g.name = x.r.partner;
      }
      const bySrc = {};
      for (const [id, t] of Object.entries(D.tx)) if (t.src) bySrc[t.src] = id;
      for (const [ym, g] of Object.entries(groups)) {
        const src = `n26save:${ym}`, oldId = bySrc[src], old = oldId && D.tx[oldId];
        let members = g.members, base = { amount: 0, n: 0, m: [], date: g.last }, add = false;
        if (old && old.m) { // 이미 넣은 묶음: 새 거래만 더함
          const have2 = new Set(old.m); members = g.members.filter(x => !have2.has(x.k));
          base = { amount: old.amount, n: old.n || old.m.length, m: old.m, date: old.date > g.last ? old.date : g.last }; add = true;
        } else if (old && (old.n || 0) >= g.members.length) members = []; // 예전 방식 묶음이 이 파일보다 크거나 같으면 그대로 둠
        const delta = -members.reduce((a, x) => a + x.cents, 0) / 100;
        const amount = Math.round((base.amount + delta) * 100) / 100;
        const isDup = !members.length || !amount;
        st.rows.push({ i: st.rows.length, r: { date: base.date, amount: -amount, partner: g.name, ref: '', src }, act: 'save', pkey: '', rkey: '', memo: g.name || '저금',
          save: { id: oldId, amount, n: base.n + members.length, m: [...base.m, ...members.map(x => x.k)], ym, add: add && members.length > 0 }, unknown: false, internal: false, dup: isDup, fee: { eur: 0, fee: 0 } });
      }
      st.total = recs.length; st.dup = st.rows.filter(x => x.dup && !x.save && !x.match).length; st.internal = st.rows.filter(x => x.hidden).length;
      st.from = recs[0].date; st.step = 'list'; st.filter = 'all';
    } catch (e) {
      st.step = 'pick'; st.err = e && e.message && !/^pdf\.js$/.test(e.message) ? e.message : '파일을 못 읽었어요. 인터넷 연결(PDF 읽기 도구를 받아야 해요)과 파일을 확인해 주세요.';
    }
    draw();
  }

  async function doImport(take) {
    const btn = document.getElementById('i-go'); btn.disabled = true; btn.textContent = '넣는 중…';
    const needRate = take.some(x => x.act === 'xfer');
    const rates = needRate ? await eurKrwRates(take[0].r.date) : [];
    if (needRate && !rates.length && !QUOTES['EURKRW=X']) {
      btn.disabled = false; btn.textContent = `${take.length}건 넣기`;
      return toast('환율을 못 받아서 송금의 원화를 채울 수 없어요. 인터넷에 연결한 뒤 다시 눌러 주세요');
    }
    const now = Date.now(), abs2 = n => Math.round(Math.abs(n) * 100) / 100;
    const entries = take.map((x, k) => {
      const r = x.r, base = { date: r.date, src: r.src, u: now + k };
      if (x.act === 'save') return [x.save.id || newId(), { acc: 'de', type: 'save', ...base, amount: x.save.amount, n: x.save.n, m: x.save.m, memo: x.memo }];
      if (x.act === 'xfer') {
        const rate = rateOn(rates, r.date);
        return [newId(), { type: 'xfer', ...base, eur: x.fee.eur, ...(x.fee.fee ? { fee: x.fee.fee } : {}), krw: Math.round(x.fee.eur * rate), est: true, memo: x.memo }];
      }
      if (x.act === 'in') return [newId(), { acc: 'de', type: 'in', ...base, amount: abs2(r.amount), memo: x.memo }];
      if (x.act === 'pass') return [newId(), { acc: 'de', type: r.amount > 0 ? 'in' : 'out', ...base, amount: abs2(r.amount), pass: true, ...(r.amount < 0 ? { cat: '기타' } : {}),
        memo: x.pairOf ? `${x.memo} · ${x.pairOf.memo} 전달` : x.memo }];
      if (x.act.startsWith('ref:')) return [newId(), { acc: 'de', type: 'out', ...base, amount: abs2(r.amount), refund: true, cat: x.act.slice(4), memo: x.memo }];
      return [newId(), { acc: 'de', type: 'out', ...base, amount: abs2(r.amount), cat: x.act.slice(4), memo: x.memo }];
    });
    // 직접 넣은 것과 같았던 거래: 그 기록에 가져오기 표시(src)를 붙여서 다음에 다시 안 겹치게
    for (const x of st.rows) if (x.match && D.tx[x.match] && !D.tx[x.match].src) entries.push([x.match, { ...D.tx[x.match], src: x.r.src }]);
    // 짝지은 '넘겨준 돈'의 기준이 이미 가계부에 수입으로 들어가 있던 Kindergeld 면 → 그것도 '그냥 지나가는 돈'으로
    const bySrc2 = {};
    for (const [id, t] of Object.entries(D.tx)) if (t.src) bySrc2[t.src] = id;
    for (const x of take) {
      const a = x.act === 'pass' && x.pairOf && x.pairOf.dup ? x.pairOf : null;
      const id = a && (bySrc2[a.r.src] || a.match);
      const t = id && D.tx[id];
      if (t && t.type === 'in' && !t.pass && !entries.some(([eid]) => eid === id)) entries.push([id, { ...t, pass: true, u: now }]);
    }
    changeMany('tx', entries);
    const rules = Object.entries(st.rules).filter(([k, v]) => k && D.rules[k] !== v);
    if (rules.length) changeMany('rules', rules);
    closeSheet();
    toast(`${take.length}건 넣었어요`);
  }
  openSheet(''); draw();
}

// 한국 계좌들 잔액 한꺼번에 업데이트 (토스 화면을 보고 적기). 같은 날 다시 적으면 그 날 기록을 바꿈
// 그날 환율로 추정한 송금(Remitly 등)을 실제 받은 원화로 한꺼번에 고치기
function openFixKrw() {
  const list = allTx().filter(t => t.type === 'xfer' && t.est).sort((a, b) => b.date.localeCompare(a.date));
  if (!list.length) return toast('고칠 송금이 없어요');
  openSheet(shTop('송금 원화 고치기', '한국 계좌') + `<h2>실제 받은 원화</h2>
    <p class="mut" style="margin:4px 0 12px;font-size:14px">은행 앱이나 Remitly 메일에서 실제로 들어온 금액을 적어 주세요. 모르는 건 비워 두면 추정값 그대로예요.</p>
    ${list.map(t => `<div class="cat-edit" style="margin-bottom:4px"><span style="flex:1.2;min-width:0;font-size:14px"><b>${dayLabel(t.date)}</b><br><span class="mut">${fmtEUR(t.eur)} · 추정 ${fmtKRW(t.krw)}</span></span>
      <input class="inp num" data-k="${t.id}" placeholder="₩ 받은 금액" inputmode="numeric" style="flex:1;text-align:right"></div>`).join('')}
    <button class="btn wide" id="fk-save" style="margin-top:12px">저장</button>`);
  document.getElementById('fk-save').onclick = () => {
    const ch = [];
    for (const el of $sheet.querySelectorAll('[data-k]')) {
      const n = parseAmt(el.value, true); if (!n) continue;
      const t = D.tx[el.dataset.k]; if (!t) continue;
      const { est, ...rest } = t;
      ch.push([el.dataset.k, { ...rest, krw: Math.round(n), u: Date.now() }]);
    }
    if (!ch.length) return toast('고친 금액이 없어요');
    changeMany('tx', ch); closeSheet(); toast(`${ch.length}건 고쳤어요`);
  };
}

function openKrAccounts() {
  const last = krSnap();
  const rows = D.kr.accts.filter(a => !a.off).map(a => ({ id: a.id, name: a.name, v: last && a.id in last.a ? String(last.a[a.id]) : '' }));
  const removed = D.kr.accts.filter(a => a.off).map(a => ({ ...a })); // 뺀 계좌는 이름만 남겨 둠 (예전 잔액 기록 유지)
  if (!rows.length) rows.push({ id: newId(), name: '', v: D.bal.kr ? String(D.bal.kr.amount) : '' });
  let date = today();
  const total = () => rows.reduce((p, r) => p + (parseAmt(r.v, true) || 0) * (String(r.v).trim().startsWith('-') ? -1 : 1), 0);
  const draw = () => {
    $sheet.innerHTML = shTop('잔액 업데이트', '한국 계좌') + `<h2>내 한국 계좌</h2>
      <p class="mut" style="margin:4px 0 12px;font-size:14px">토스 '내 계좌' 화면을 보고 계좌마다 지금 잔액을 적어 주세요. 계좌끼리 옮긴 돈은 합계가 그대로라 신경 안 써도 돼요.${last ? `<br>지난번: ${last.date.slice(5).replace('-', '월 ')}일 · 합계 ${fmtKRW(last.total)}` : ''}</p>
      ${rows.map((r, i) => `<div class="cat-edit" style="margin-bottom:4px">
        <input class="inp" data-n="${i}" value="${esc(r.name)}" placeholder="계좌 이름 (예: 국민)" maxlength="40" style="flex:1.1">
        <input class="inp num" data-v="${i}" value="${esc(r.v)}" placeholder="₩ 잔액" inputmode="numeric" style="flex:1;text-align:right">
        <button class="x-btn" data-x="${i}" aria-label="계좌 빼기">${ic('x', 16, 2)}</button></div>`).join('')}
      <button class="btn line small" id="ka-add" style="margin:8px 0 14px">${ic('plus', 15, 2.4)} 계좌 추가</button>
      <div class="acct total" style="margin-bottom:14px"><span>합계</span><b class="num" id="ka-total">${fmtKRW(total())}</b></div>
      <div class="fields"><label class="f"><small>이 날 기준 잔액</small><input class="inp" type="date" id="ka-date" value="${date}"></label><span></span></div>
      <button class="btn wide" id="ka-save">저장</button>`;
    $sheet.querySelectorAll('[data-n]').forEach(el => el.oninput = () => { rows[+el.dataset.n].name = el.value; });
    $sheet.querySelectorAll('[data-v]').forEach(el => el.oninput = () => { rows[+el.dataset.v].v = el.value; document.getElementById('ka-total').textContent = fmtKRW(total()); });
    $sheet.querySelectorAll('[data-x]').forEach(el => el.onclick = () => {
      const r = rows[+el.dataset.x];
      if (r.name && !confirm(`'${r.name}' 계좌를 목록에서 뺄까요? (해지한 계좌 등)`)) return;
      const [gone] = rows.splice(+el.dataset.x, 1);
      if (gone.name.trim() && D.kr.accts.some(a => a.id === gone.id)) removed.push({ id: gone.id, name: gone.name.trim(), off: true });
      draw();
    });
    document.getElementById('ka-date').onchange = e => { date = e.target.value; };
    document.getElementById('ka-add').onclick = () => { rows.push({ id: newId(), name: '', v: '' }); draw(); $sheet.querySelector(`[data-n="${rows.length - 1}"]`)?.focus(); };
    document.getElementById('ka-save').onclick = () => {
      const keep = rows.filter(r => r.name.trim() || String(r.v).trim());
      if (keep.some(r => !r.name.trim())) return toast('계좌 이름을 넣어 주세요');
      if (keep.some(r => parseAmt(r.v, true) == null)) return toast('잔액을 모두 넣어 주세요');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('날짜를 골라 주세요');
      const accts = [...keep.map(r => ({ id: r.id, name: r.name.trim() })), ...removed.filter(x => !keep.some(r => r.id === x.id))];
      const a = Object.fromEntries(keep.map(r => [r.id, Math.round(parseAmt(r.v, true) * (String(r.v).trim().startsWith('-') ? -1 : 1))]));
      const snaps = [...(D.kr.snaps || []).filter(s => s.date !== date), { date, a }].sort((x, y) => x.date.localeCompare(y.date)).slice(-400);
      change('kr', null, { accts, snaps });
      closeSheet(); toast('잔액을 저장했어요');
    };
  };
  openSheet(''); draw();
}

// 잔액 바로 고치기: 'kr' | 'de' | 'sv'(모은 돈 = 저금 Space 잔액). 그 날짜 뒤의 기록으로 지금 값을 계속 계산
function openBalance(k) {
  if (k === 'kr') return openKrAccounts();
  const L = { kr: ['한국 계좌 잔액', '은행 앱에 보이는 한국 계좌 잔액을 적어 주세요.'], de: ['독일 계좌 잔액', 'N26 앱 메인 계좌 잔액을 적어 주세요.'], sv: ['모은 돈 (저금)', 'N26 앱의 Space(비상금 등) 잔액을 적어 주세요. 여러 Space면 더한 값으로요.'] }[k];
  if (!L) return;
  const cur = k === 'kr' ? '₩' : '€', fmt = n => k === 'kr' ? fmtKRW(n) : fmtEUR(n);
  const b = D.bal[k] || {};
  const now = k === 'sv' ? savingsNow()?.total : balanceNow(k);
  openSheet(shTop('잔액 맞추기', '') + `<h2>${L[0]}</h2>
    <p class="mut" style="margin:4px 0 14px;font-size:14px">${L[1]} 이 날짜 뒤에 넣은 기록으로 지금 값을 계속 계산해요.${now != null ? `<br>지금 앱에서 계산한 값: <b>${fmt(now)}</b>` : ''}</p>
    <div class="big-in"><span>${cur}</span><input id="bl-amt" inputmode="decimal" autocomplete="off" value="${b.amount != null ? String(b.amount).replace('.', k === 'kr' ? '.' : ',') : ''}" placeholder="0" aria-label="금액"></div><div class="hint" id="bl-h"></div>
    <div class="fields"><label class="f"><small>이 날 끝 기준</small><input class="inp" type="date" id="bl-date" value="${b.date || today()}"></label><span></span></div>
    <div class="actions">${D.bal[k] ? '<button class="btn danger" id="bl-del">맞춘 값 지우기</button>' : ''}<button class="btn" id="bl-save">저장</button></div>`);
  const inp = document.getElementById('bl-amt'), hint = document.getElementById('bl-h');
  const read = () => { const raw = inp.value.trim(); if (!raw) return null; const n = parseAmt(raw, k === 'kr'); return n == null ? null : (raw.startsWith('-') ? -n : n); };
  inp.oninput = () => { const n = read(); hint.textContent = n != null ? `= ${fmt(n)}` : ''; };
  inp.oninput();
  document.getElementById('bl-save').onclick = () => {
    const n = read(), dt = document.getElementById('bl-date').value;
    if (n == null) return toast('금액을 넣어 주세요');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return toast('날짜를 골라 주세요');
    change('bal', k, { amount: k === 'kr' ? Math.round(n) : Math.round(n * 100) / 100, date: dt });
    closeSheet(); toast('저장했어요');
  };
  const del = document.getElementById('bl-del');
  if (del) del.onclick = () => { if (confirm('맞춘 잔액을 지울까요? 기록은 그대로예요.')) { change('bal', k, null); closeSheet(); toast('지웠어요'); } };
  setTimeout(() => inp.focus(), 250);
}

const BAL_ROWS = [['de', '독일 계좌 잔액 (€)'], ['sv', '모은 돈 · 저금 Space 잔액 (€)']]; // 한국 계좌는 계좌별로 (openKrAccounts)

// 다른 기기의 가계부에 이 기기를 연결 (링크나 키를 붙여넣기).
// 아이폰 홈 화면 앱은 Safari 와 저장소가 따로라서 링크를 열어도 연결이 안 됨 → 앱 안에서 붙여넣어야 함
async function connectKey(raw) {
  const m = String(raw || '').match(/(?:k=)?([A-Za-z0-9]{24,64})/);
  if (!m) return toast('링크나 키를 확인해 주세요');
  const k = m[1];
  if (k === KEY) return toast('이미 이 가계부예요');
  let there;
  try { const r = await fetch(`${API}/d/${k}`, { cache: 'no-store' }); if (!r.ok) throw 0; there = normalize(await r.json()); }
  catch { return toast('연결하지 못했어요. 인터넷을 확인해 주세요'); }
  const nThere = Object.keys(there.tx).length, sThere = Object.keys(there.stocks).length;
  if (!confirm(`그 가계부(기록 ${nThere}건, 주식 ${sThere}개)로 이 기기를 연결할까요?`)) return;
  // 이 기기에만 있던 것도 합치기 (같은 가져오기 기록·같은 종목은 건너뜀)
  const srcs = new Set(Object.values(there.tx).map(t => t.src).filter(Boolean)), syms = new Set(Object.values(there.stocks).map(s => s.sym));
  const myTx = Object.entries(D.tx).filter(([id, t]) => !there.tx[id] && !(t.src && srcs.has(t.src)));
  const mySt = Object.entries(D.stocks).filter(([id, s]) => !there.stocks[id] && !syms.has(s.sym));
  let q = {};
  if ((myTx.length || mySt.length) && confirm(`이 기기에만 있는 기록 ${myTx.length}건, 주식 ${mySt.length}개도 그 가계부에 합칠까요?`)) {
    q = { tx: Object.fromEntries(myTx), stocks: Object.fromEntries(mySt) };
    if (!there.kr.accts.length && D.kr.accts.length) q.kr = D.kr;
    for (const k2 of ['ico', 'rules']) { const add = Object.fromEntries(Object.entries(D[k2] || {}).filter(([n]) => !(n in there[k2]))); if (Object.keys(add).length) q[k2] = add; }
  }
  KEY = k; lsSet(LS.key, KEY); lsSet('budget:pulled', true);
  Q = q; lsSet(LS.queue, Q);
  D = applyQueue(there, Q); saveLocal();
  closeSheet(); toast('연결했어요'); scheduleFlush(50); refreshQuotes(true);
}

      change('recur', b.dataset.rstop, { ...r, until: ymOf(today()) }); draw();
    });
    $sheet.querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => {
      const r = D.recur[b.dataset.rdel]; if (!r) return;
      if (!confirm(`'${r.memo || r.cat || '반복'}' 반복을 지울까요? 이미 넣은 기록은 그대로예요.`)) return;
      change('recur', b.dataset.rdel, null); draw();
    });
    document.getElementById('k-copy').onclick = async () => {
      try { await navigator.clipboard.writeText(link); toast('복사했어요'); }
      catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('k-link')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('길게 눌러 복사해 주세요'); }
    };
    document.getElementById('x-exp').onclick = () => {
      const blob = new Blob([JSON.stringify({ app: 'budget', at: new Date().toISOString(), data: D }, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `가계부-백업-${today()}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    };
    document.getElementById('x-imp').onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const j = JSON.parse(await file.text()), data = normalize(j.data || j);
        if (!confirm(`기록 ${Object.keys(data.tx).length}건, 종목 ${Object.keys(data.stocks).length}개로 지금 가계부를 바꿀까요? 지금 기록은 없어져요.`)) return;
        const r = await fetch(`${API}/d/${KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ restore: data }) });
        if (!r.ok) throw 0;
        Q = {}; lsSet(LS.queue, Q); D = normalize(await r.json()); saveLocal(); toast('되살렸어요'); closeSheet();
      } catch { toast('되살리지 못했어요. 파일과 인터넷을 확인해 주세요'); }
    };
  };
  openSheet(''); draw();
}

// ───────── 누르기 ─────────
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb && !e.target.closest('#sheet')) { V.tab = tb.dataset.tab; V.cat = null; V.bar = null; V.q = ''; V.searching = false; render(); scrollTo(0, 0); if (V.tab !== 'de') refreshQuotes(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'close') return closeSheet();
  if (a === 'settings') return openSettings();
  if (a === 'bal') return openBalance(v);
  if (a === 'kr-accts') return openKrAccounts();
  if (a === 'search') { V.searching = !(V.searching || V.q); if (!V.searching) V.q = ''; render(); document.getElementById('hist-q')?.focus(); return; }
  if (a === 'search-clear') { V.q = ''; V.searching = true; render(); document.getElementById('hist-q')?.focus(); return; }
  if (a === 'fix-krw') return openFixKrw();
  if (a === 'kr-gap') {
    const g = krGap(); if (!g || Math.abs(g.gap) < 1000) return;
    const isOut = g.gap < 0;
    if (!confirm(`${isOut ? '기록 안 한 지출' : '기록 안 한 입금'} ${fmtKRW(Math.abs(g.gap))}을 ${g.to} 날짜로 넣을까요? 나중에 무엇이었는지 알면 고칠 수 있어요.`)) return;
    change('tx', newId(), { acc: 'kr', type: isOut ? 'out' : 'in', date: g.to, amount: Math.abs(g.gap), ...(isOut ? { cat: '기타' } : {}), memo: isOut ? '기록 안 한 지출' : '기록 안 한 입금', u: Date.now() });
    render(); return toast('넣었어요');
  }
  if (a === 'import') return openImport();
  if (a === 'add') return openTx(V.tab);
  if (a === 'edit') { if (D.tx[el.dataset.id]) openTx(V.tab, el.dataset.id); return; }
  if (a === 'prev') return shiftPeriod(-1);
  if (a === 'next') return shiftPeriod(1);
  if (a === 'mode') { V.mode = v; V.cat = null; V.bar = null; return render(); }
  if (a === 'cat') { V.cat = v && V.cat !== v ? v : null; return render(); }
  if (a === 'bar') { V.bar = V.bar === +v ? null : +v; return render(); }
  if (a === 'stock-add') return openStockAdd();
  if (a === 'stock') return openStock(el.dataset.id);
  if (a === 'refresh') { toast('새로 받는 중…'); return refreshQuotes(true); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen()) closeSheet(); });

// 다른 기기 링크로 열었을 때: #k=키
(function linkFromHash() {
  const m = location.hash.match(/k=([A-Za-z0-9]{24,64})/);
  if (!m) return;
  history.replaceState(null, '', location.pathname);
  if (m[1] === KEY) return;
  const hasLocal = Object.keys(D.tx).length || Object.keys(D.stocks).length;
  if (hasLocal && !confirm('이 기기에 있던 가계부 대신, 링크의 가계부로 바꿀까요?')) return;
  KEY = m[1]; lsSet(LS.key, KEY); D = normalize({}); Q = {}; lsSet(LS.queue, Q); saveLocal(); lsSet('budget:pulled', true);
})();

runRecur(); // 인터넷이 없어도 이 기기 자료로 이번 달 반복 기록을 넣어 둠 (id 가 정해져 있어서 겹치지 않음)
render();
pull();
refreshQuotes(true);
if (Object.keys(Q).length) scheduleFlush(100);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pull(); refreshQuotes(); } });
addEventListener('online', () => { scheduleFlush(50); pull(); });
// 주식을 보고 있을 때는 1분마다 시세 새로
setInterval(() => { if (document.visibilityState === 'visible' && V.tab !== 'de') refreshQuotes(); }, 60000);

// 새 버전이 올라오면 알아서 다시 열기: 앱을 다시 볼 때마다 sw.js 가 바뀌었는지 확인 → 바뀌었으면 새로고침
// (홈 화면 앱은 뒤로 갔다 와도 페이지를 새로 읽지 않아서, 이게 없으면 예전 화면이 계속 남음)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    if (sheetOpen()) window.__reloadAfterSheet = true; else location.reload();
  });
}
</script>
</body>
</html>
